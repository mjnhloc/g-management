version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: g-management-app
    ports:
      - "8080:8080"
    environment:
      DSN: gadmin:gpassword@tcp(mysql:3306)/gdb
      ES_URL: http://elasticsearch:9200
      REDIS_URL: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    depends_on:
      - mysql
      - elasticsearch
      - redis
      - jaeger
    # volumes:
    #   - .:/app
    # command: ["go", "run", "./cmd/main.go"]

  mysql:
    image: mysql:8
    container_name: g-management-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./internal/migrations:/docker-entrypoint-initdb.d # runs SQL files on first startup

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: g-management-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  redis:
    image: redis:7.2-alpine
    container_name: g-management-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  jaeger:
    image: jaegertracing/all-in-one:1.47
    container_name: g-management-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Web UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    volumes:
      - jaeger_data:/badger

volumes:
  mysql_data:
  es_data:
  redis_data:
  jaeger_data:
